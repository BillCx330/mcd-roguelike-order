<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f7">
  <title>麦门大富翁 · 命运汉堡堡</title>
  <style>
:root {
  color-scheme: light;
  --app-bg: #eaf0f6;
  --rail-bg: #edf2f7;
  --side-bg: #f8fafc;
  --main-bg: #fff;
  --line: #e2e6eb;
  --line-soft: #edf0f3;
  --text: #24272c;
  --muted: #656a72;
  --quiet: #9298a1;
  --blue: #8db8f1;
  --blue-soft: #e7f1ff;
  --gold: #b7872d;
  --green: #36956d;
  --orange: #bd8244;
  --sans: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  --mono: "Cascadia Code", "Consolas", "Microsoft YaHei UI", monospace;
}
* { box-sizing: border-box; }
body { width: 100%; height: 100vh; min-width: 320px; margin: 0; overflow: hidden; background: var(--app-bg); color: var(--text); font-family: var(--sans); font-size: 13px; }
button, textarea { color: inherit; font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
button:focus-visible, textarea:focus-visible { outline: 2px solid rgba(72,133,211,.5); outline-offset: 2px; }
.app-shell { width: calc(100% - 6px); height: calc(100% - 6px); display: grid; grid-template-rows: 30px minmax(0,1fr); margin: 3px; overflow: hidden; border: 1px solid #d9dfe6; border-radius: 9px; background: var(--main-bg); box-shadow: 0 2px 9px rgba(47,61,78,.08); }

/* Desktop app chrome */
.window-bar { display: flex; align-items: center; gap: 20px; padding: 0 9px; background: #edf3f8; color: #858b93; user-select: none; }
.window-navigation { height: 100%; display: flex; align-items: center; gap: 13px; }
.window-navigation > span:not(.window-panel-icon) { width: 18px; font: 25px/1 var(--sans); text-align: center; }
.window-navigation > span:nth-child(2) { color: #b8c0c9; }
.window-panel-icon { width: 19px; height: 17px; margin-left: 1px; border: 1.5px solid #89919a; border-radius: 3px; position: relative; }
.window-panel-icon::after { content: ""; position: absolute; top: 0; bottom: 0; left: 6px; border-left: 1.5px solid #89919a; }
.window-menu { display: flex; align-items: center; gap: 26px; height: 100%; margin-left: 2px; color: #7b828a; font-size: 12px; }
.window-controls { height: 100%; display: flex; align-items: stretch; margin-left: auto; color: #555b63; font: 16px var(--sans); }
.window-controls span { width: 44px; display: grid; place-items: center; }
.window-controls span:last-child { width: 42px; font-size: 18px; }
.window-controls span:last-child:hover { background: #e45d5d; color: white; }

/* Icon rail and project sidebar */
.workspace { min-width: 0; min-height: 0; display: grid; grid-template-columns: 76px minmax(330px,27vw) minmax(0,1fr); overflow: hidden; border-radius: 17px 17px 0 0; background: var(--main-bg); }
.icon-rail { min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px 0 9px; border-right: 1px solid #e0e6ec; background: var(--rail-bg); }
.rail-top, .rail-bottom { display: grid; justify-items: center; gap: 8px; }
.rail-button { width: 43px; height: 43px; display: grid; place-items: center; border: 0; border-radius: 13px; background: transparent; color: #858c95; transition: background .15s ease,color .15s ease; }
.rail-button:hover { background: rgba(255,255,255,.7); color: #42474e; }
.rail-button.active { background: #dfe7ef; color: #29323c; }
.rail-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rail-button.active:first-child svg { fill: currentColor; stroke: currentColor; }
.rail-more { font-size: 21px; letter-spacing: 2px; }
.mini-profile { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #c8d3dd; border-radius: 50%; background: #f8fbfe; color: #586574; font-size: 10px; font-weight: 700; }
.sidebar { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 15px 13px 10px; overflow: hidden; border-right: 1px solid #e1e5ea; background: var(--side-bg); transition: width .2s ease,flex-basis .2s ease,transform .2s ease; }
.sidebar-heading { min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 5px 19px 9px; }
.workspace-picker { display: inline-flex; align-items: center; gap: 9px; min-width: 0; padding: 0; border: 0; background: transparent; color: #3d4248; font-size: 16px; font-weight: 650; }
.workspace-picker:hover { color: #111; }
.picker-chevron { color: #888f98; font-size: 14px; font-weight: 400; }
.heading-actions { display: flex; align-items: center; gap: 6px; }
.quiet-icon { width: 27px; height: 27px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #7d858e; font-size: 20px; }
.quiet-icon:hover { background: #edf0f3; color: #3c4148; }
.new-task-button { height: 37px; display: flex; align-items: center; gap: 10px; margin: 0 1px 24px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: #454a51; text-align: left; font-size: 12px; }
.new-task-button:hover { background: #edf0f3; }
.new-task-button svg { width: 17px; height: 17px; fill: none; stroke: #555b63; stroke-width: 1.9; stroke-linecap: round; }
.new-task-button kbd { margin-left: auto; padding: 2px 5px; border: 1px solid #e0e3e7; border-radius: 4px; background: #f6f8fa; color: #858b93; font: 8px var(--mono); opacity: 0; transition: opacity .15s ease; }
.new-task-button:hover kbd { opacity: 1; }
.sidebar-label { margin: 0 8px 8px; color: #858b92; font-size: 11px; font-weight: 600; }
.project-item, .recent-item { width: 100%; min-width: 0; height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: #4a4f56; text-align: left; font-size: 11px; }
.project-item:hover, .recent-item:hover { background: #eef1f4; }
.project-item svg { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: #666e77; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.project-item > span:nth-of-type(1) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-chevron { margin-left: auto; color: #8c9299; }
.recent-item.project-child { margin: 1px 0 10px; padding-left: 38px; }
.recent-item.project-child.active, .recent-list .recent-item.active { background: #e9edf1; color: #343940; }
.recent-item.project-child span, .recent-list .recent-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.secondary-project { margin-top: 1px; }
.recent-heading { margin-top: 17px; margin-bottom: 8px; }
.recent-list { display: grid; gap: 2px; }
.recent-list .recent-item { height: 34px; }
.sidebar-spacer { flex: 1; }
.sidebar-bottom-note { display: flex; align-items: center; gap: 9px; margin: 8px 2px 0; padding: 9px 7px; border-top: 1px solid #e6e9ed; }
.mcp-mini-icon { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid #dfe4e9; border-radius: 7px; background: #fff; color: #638f91; font-size: 13px; }
.sidebar-bottom-note strong, .sidebar-bottom-note small { display: block; }
.sidebar-bottom-note strong { color: #535962; font-size: 9px; font-weight: 600; }
.sidebar-bottom-note small { display: flex; align-items: center; gap: 5px; margin-top: 3px; color: #92969d; font-size: 8px; }
.sidebar-bottom-note small i { width: 5px; height: 5px; border-radius: 50%; background: #c79b59; }
.sidebar-bottom-note button { margin-left: auto; border: 0; background: transparent; color: #858a91; font-size: 14px; }
.sidebar-backdrop { display: none; }

/* Thread, agent output and compose area */
.main-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--main-bg); }
.topbar { height: 63px; flex: 0 0 63px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 22px 0 25px; border-bottom: 1px solid #f0f1f2; background: rgba(255,255,255,.97); }
.topbar-left, .topbar-right, .thread-title { display: flex; align-items: center; }
.topbar-left { min-width: 0; gap: 13px; }
.icon-button { width: 27px; height: 27px; display: grid; place-items: center; flex: 0 0 auto; border: 0; border-radius: 6px; background: transparent; color: #77808a; }
.icon-button:hover { background: #f1f3f5; color: #343a41; }
.menu-toggle svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.thread-title { min-width: 0; gap: 12px; }
.thread-title svg { width: 19px; height: 19px; flex: 0 0 19px; fill: none; stroke: #58616c; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
.thread-title strong { overflow: hidden; color: #282c31; font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
.topbar-right { gap: 11px; color: #858b92; }
.top-icon { width: 27px; height: 27px; display: grid; place-items: center; border: 0; border-radius: 5px; background: transparent; color: #858b92; font-size: 18px; }
.top-icon:hover { background: #f2f4f6; color: #454b53; }
.top-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.topbar-right .expand-icon { margin-left: 2px; padding-left: 12px; border-left: 1px solid #e5e7ea; border-radius: 0; }
.tab-count { width: 18px; height: 18px; display: grid; place-items: center; border: 1px solid #b9c0c8; border-radius: 4px; color: #6e747c; font: 10px var(--mono); }
.chat-window { min-height: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
.simulation-banner { width: min(1040px,calc(100% - 76px)); flex: 0 0 auto; display: flex; align-items: flex-start; gap: 9px; margin: 10px auto 0; padding: 8px 11px; border: 1px solid #ebedf0; border-radius: 7px; background: #fbfcfd; color: #707780; }
.banner-icon { width: 14px; height: 14px; flex: 0 0 14px; display: grid; place-items: center; margin-top: 1px; border: 1px solid #a5adb7; border-radius: 50%; color: #7e8792; font: 700 9px var(--mono); }
.simulation-banner p { flex: 1; margin: 0; font-size: 9px; line-height: 1.6; }
.simulation-banner strong { margin-right: 4px; color: #5f6872; font-weight: 650; }
.banner-dismiss { width: 18px; height: 18px; flex: 0 0 18px; border: 0; border-radius: 4px; background: transparent; color: #a0a5ac; font-size: 14px; line-height: 1; }
.banner-dismiss:hover { background: #eef1f3; color: #59616a; }
.conversation { width: min(1100px,100%); min-height: 0; flex: 1; align-self: center; overflow-y: auto; padding: 31px 38px 24px; scrollbar-color: #d3d8de transparent; scrollbar-width: thin; }
.message { display: flex; align-items: flex-start; margin: 0 0 27px; animation: appear .18s ease-out; }
@keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.message-avatar { width: 24px; height: 24px; display: grid; place-items: center; flex: 0 0 24px; border: 0; border-radius: 7px; background: #eaf3fb; color: #428eb5; font: 700 11px var(--mono); }
.message-user { justify-content: flex-end; margin-top: 12px; }
.message-user .message-avatar { order: 2; border: 1px solid #dfe9f6; border-radius: 50%; background: #edf3fa; color: #71839a; font-family: var(--sans); font-size: 9px; }
.message-bubble { width: min(920px,100%); min-width: 0; }
.message-assistant .message-bubble { padding: 0; }
.message-user .message-bubble { width: auto; max-width: min(73%,680px); margin-left: auto; padding: 12px 17px; border: 1px solid #e1edfb; border-radius: 19px 6px 19px 19px; background: var(--blue-soft); }
.message-meta { display: flex; align-items: center; gap: 8px; margin: 0 0 7px; }
.message-meta strong { color: #555c64; font-size: 9px; font-weight: 650; }
.message-meta time { color: #a1a6ad; font: 8px var(--mono); }
.message-user .message-meta { display: none; }
.message-text { margin: 0; color: #32363b; font-size: 14px; line-height: 1.9; white-space: pre-line; }
.greeting-text { color: #383c41; }
.reply-illustration { width: min(560px,100%); margin: 12px 0 2px; }
.reply-illustration .text-art { margin: 0; padding: 12px 16px; border: 1px solid #e6ecf1; border-radius: 12px; background: #f7f9fb; color: #47515c; font-family: var(--mono); font-size: 15px; font-weight: 600; line-height: 1.75; white-space: pre; overflow-x: auto; }
.art-forge .text-art { background: #fff6ef; border-color: #f3ddc9; }
.art-nutrition .text-art { background: #fff2ea; border-color: #f6ddcd; }
.art-lottery .text-art { background: #f6f0ff; border-color: #e6d9f7; }
.art-secret .text-art { background: #eef2fd; border-color: #dbe4f7; }
.art-finish .text-art { background: #eef7f0; border-color: #d7e9dc; }
.art-float { animation: ill-float 3.4s ease-in-out infinite; }
@keyframes ill-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.message-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
.action-button, .suggestion-chip { min-height: 34px; padding: 0 12px; border: 1px solid #dfe4e9; border-radius: 9px; background: #fff; color: #47515c; font-size: 11px; transition: background .14s ease,border-color .14s ease,box-shadow .14s ease; }
.action-button:hover, .suggestion-chip:hover { border-color: #c7d0d9; background: #f8fafc; box-shadow: 0 1px 2px rgba(28,39,51,.06); }
.action-button.action-quiet { border-color: #e2e5e9; background: #fff; color: #68717b; }
.action-button.action-quiet:hover { background: #f6f8fa; }
.action-button.action-primary { border-color: #b8d2f1; background: #eaf3ff; color: #355d8c; font-weight: 650; }
.action-button.action-primary:hover { border-color: #9cbee9; background: #deecfc; }
.composer-area { z-index: 1; width: min(1110px,100%); flex: 0 0 auto; align-self: center; padding: 7px 28px 11px; background: linear-gradient(180deg,rgba(255,255,255,0),#fff 18%); }
.suggestion-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 9px 2px; }
.suggestion-chip { min-height: 30px; border-color: #e4e7ea; background: #fff; color: #636b74; font-size: 10px; }
.composer { min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; padding: 13px 13px 9px 16px; border: 1px solid #e1e5e9; border-radius: 20px; background: #fff; box-shadow: 0 5px 18px rgba(35,50,66,.055); transition: border-color .15s ease,box-shadow .15s ease; }
.composer:focus-within { border-color: #cfd9e4; box-shadow: 0 6px 20px rgba(35,50,66,.085); }
.composer textarea { width: 100%; min-height: 53px; max-height: 120px; resize: none; padding: 0; border: 0; outline: 0; background: transparent; color: #30343a; font-size: 12px; line-height: 1.6; }
.composer textarea::placeholder { color: #afb4ba; }
.composer-toolbar { display: flex; align-items: center; gap: 9px; }
.composer-add { width: 25px; height: 25px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #3f454b; font-size: 20px; line-height: 1; }
.composer-add:hover { background: #f1f3f5; }
.approval-mode { height: 27px; display: inline-flex; align-items: center; gap: 6px; padding: 0 7px; border: 0; border-radius: 6px; background: transparent; color: #7f858c; font-size: 9px; }
.approval-mode:hover { background: #f5f6f7; color: #454b52; }
.approval-mode span { color: #7a8792; font-size: 12px; }
.composer-spacer { flex: 1; }
.model-select { display: inline-flex; align-items: center; gap: 7px; padding: 4px 5px; border: 0; border-radius: 5px; background: transparent; color: #68717a; font-size: 9px; }
.model-select:hover { background: #f4f5f6; }
.model-select span { color: #9298a0; }
.voice-button { width: 27px; height: 27px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #737b84; font-size: 15px; }
.voice-button:hover { background: #f1f3f5; }
.send-button { width: 33px; height: 33px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #9fc4f5; color: #fff; font: 700 19px var(--sans); }
.send-button:hover { background: #81b0ed; }
.composer-hint { margin: 7px 2px 0; color: #a0a5ab; font-size: 8px; text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.workspace.sidebar-collapsed { grid-template-columns: 76px 0 minmax(0,1fr); }
.sidebar-collapsed .sidebar { width: 0; min-width: 0; padding: 0; overflow: hidden; border: 0; }
@media (max-width: 1050px) {
  .workspace { grid-template-columns: 62px minmax(280px,31vw) minmax(0,1fr); }
  .workspace.sidebar-collapsed { grid-template-columns: 62px 0 minmax(0,1fr); }
  .icon-rail { padding-top: 9px; }
  .rail-button { width: 39px; height: 39px; }
  .sidebar { padding-left: 10px; padding-right: 10px; }
  .topbar { padding-left: 15px; padding-right: 15px; }
  .simulation-banner { width: calc(100% - 42px); }
  .conversation { padding-left: 24px; padding-right: 24px; }
  .composer-area { padding-left: 18px; padding-right: 18px; }
}
@media (max-width: 760px) {
  .window-bar { height: 28px; }
  .window-menu { gap: 15px; font-size: 10px; }
  .window-navigation { gap: 7px; }
  .window-controls span { width: 31px; }
  .workspace { position: relative; grid-template-columns: 54px minmax(0,1fr); }
  .workspace.sidebar-collapsed { grid-template-columns: 54px minmax(0,1fr); }
  .icon-rail { z-index: 2; }
  .sidebar { z-index: 5; position: absolute; inset: 0 auto 0 54px; width: min(340px,calc(100vw - 68px)); transform: translateX(-110%); box-shadow: 12px 0 30px rgba(24,39,54,.13); }
  .workspace.sidebar-open .sidebar { transform: translateX(0); }
  .workspace.sidebar-open .sidebar-backdrop { z-index: 4; position: absolute; inset: 0; display: block; background: rgba(39,49,61,.2); }
  .sidebar-collapsed .sidebar { width: min(340px,calc(100vw - 68px)); min-width: 0; padding: 15px 13px 10px; border-right: 1px solid #e1e5ea; }
  .sidebar-toggle { display: grid; }
  .topbar { height: 53px; flex-basis: 53px; padding: 0 10px; }
  .topbar-left { gap: 7px; }
  .thread-title { gap: 7px; }
  .thread-title strong { font-size: 11px; }
  .thread-title svg { width: 16px; height: 16px; flex-basis: 16px; }
  .topbar-right { gap: 4px; }
  .topbar-right .sliders-icon, .topbar-right .expand-icon, .tab-count { display: none; }
  .simulation-banner { width: calc(100% - 20px); margin-top: 8px; padding: 7px 8px; }
  .simulation-banner p { font-size: 8px; }
  .conversation { padding: 18px 12px 16px; }
  .message { gap: 7px; margin-bottom: 19px; }
  .message-bubble { width: 100%; }
  .message-user .message-bubble { max-width: 83%; padding: 9px 12px; }
  .message-text { font-size: 12px; }
  .composer-area { padding: 5px 8px 6px; }
  .composer { min-height: 94px; padding: 10px 10px 7px; border-radius: 17px; }
  .composer textarea { min-height: 41px; font-size: 10px; }
  .composer-hint { margin-top: 5px; font-size: 7px; }
}
@media (max-width: 420px) {
  .window-menu { gap: 10px; }
  .window-controls span { width: 25px; }
  .workspace { grid-template-columns: 46px minmax(0,1fr); }
  .workspace.sidebar-collapsed { grid-template-columns: 46px minmax(0,1fr); }
  .rail-button { width: 35px; height: 35px; }
  .sidebar { left: 46px; width: calc(100vw - 55px); }
  .sidebar-collapsed .sidebar { width: calc(100vw - 55px); }
  .topbar-right .top-icon:first-child { display: none; }
  .action-button { font-size: 8px; }
  .composer-toolbar { gap: 4px; }
  .approval-mode { padding: 0 4px; }
  .model-select { font-size: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

</style>
  
</head>
<body>
  <div class="app-shell">
    <div class="window-bar" aria-hidden="true">
      <div class="window-navigation"><span>‹</span><span>›</span><span class="window-panel-icon"></span></div>
      <nav class="window-menu"><span>文件</span><span>编辑</span><span>视图</span><span>帮助</span></nav>
      <div class="window-controls"><span>−</span><span>□</span><span>×</span></div>
    </div>

    <div class="workspace" id="workspace">
      <aside class="icon-rail" aria-label="主导航">
        <div class="rail-top">
          <button class="rail-button active" type="button" aria-label="主页" title="主页"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
          <button class="rail-button" type="button" aria-label="素材" title="素材"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="14" rx="2"/><path d="m7 15 3-3 2 2 2-3 4 5M16 8h5v12H8v-2"/></svg></button>

    "本局已经结算完啦。回复「再开一局」，新的路线和事件马上洗牌。",
    "冒险记录已归档。想再来一局的话，说「再开一局」即可。"
  ]
};

const state = {
  stage: "setup",
  preferences: { budget: null, budgetMode: null, food: null, people: null },
  route: [],
  roomIndex: 0,
  steps: 0,
  hp: 15,
  points: DEMO.points,
  couponsClaimed: false,
  drinkVoucher: false,
  loot: [],
  order: null,
  boss: BOSSES[0],
  bags: {}
};

const conversation = document.getElementById("conversation");
const suggestions = document.getElementById("suggestions");
const composer = document.getElementById("composer");
const input = document.getElementById("message-input");
const workspace = document.getElementById("workspace");

function scrollToLatest() {
  conversation.scrollTop = conversation.scrollHeight;
}

function createMessage(role) {
  const row = document.createElement("article");
  row.className = "message message-" + role;
  const bubble = document.createElement("div");
  bubble.className = "message-bubble";
  row.append(bubble);
  conversation.append(row);
  return bubble;
}

function insertBeforeArt(bubble, element) {
  const art = bubble.querySelector(".reply-illustration");
  if (art) bubble.insertBefore(element, art);
  else bubble.append(element);
}

function addText(bubble, text, className) {
  const paragraph = document.createElement("p");
  paragraph.className = className || "message-text";
  paragraph.textContent = text;
  insertBeforeArt(bubble, paragraph);
  return paragraph;
}

function addUser(text) {
  const bubble = createMessage("user");
  addText(bubble, text);
  scrollToLatest();
}
function addAssistant(text, kind) {
  const bubble = createMessage("assistant");
  if (text) addText(bubble, text);
  addIllustration(bubble, kind || "help");
  scrollToLatest();
  return bubble;
}

function addActions(bubble, actions) {
  const row = document.createElement("div");
  row.className = "message-actions";
  actions.forEach(({ label, run, kind }) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "action-button" + (kind ? " action-" + kind : "");
    button.textContent = label;
    button.addEventListener("click", () => {
      Array.from(row.querySelectorAll("button")).forEach((item) => { item.disabled = true; });
      run();
    });
    row.append(button);
  });
  insertBeforeArt(bubble, row);
  scrollToLatest();
}

function setSuggestions(items) {
  suggestions.replaceChildren();
  items.forEach((text) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "suggestion-chip";
    button.textContent = text;
    button.addEventListener("click", () => handleMessage(text));
    suggestions.append(button);
  });
}

function shuffle(items) {
  const result = items.slice();
  for (let i = result.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function pickFrom(key, pool) {
  if (!state.bags[key] || !state.bags[key].length) state.bags[key] = shuffle(pool);
  return state.bags[key].pop();
}

function pickRoomLine(room) {
  return pickFrom("intro-" + room, ROOM_INTROS[room] || ["前方出现一间未命名的房间。"]);
}

function greet() {
  state.stage = "setup";
  const bubble = addAssistant("🎲【麦门大富翁 · 命运汉堡堡】已开启！午休倒计时开始，群里第 17 次出现那句：「今天吃什么？」别让这道题无限 while 下去。告诉我总预算或人均预算、想吃啥、几个人；口味随便也行，想把整局交给骰子就点全随机。", "welcome");
  addActions(bubble, [
    { label: "2个人 · 总预算¥80 · 想吃鸡肉", run: () => handleMessage("2个人，总预算80元，想吃鸡肉") },
    { label: "全随机开局", run: () => handleMessage("全随机开局"), kind: "quiet" }
  ]);
  setSuggestions(["2个人，总预算80元，想吃鸡肉", "1个人，人均30元，想吃汉堡", "全随机开局"]);
}

function makeRandomPreferences() {
  const people = 1 + Math.floor(Math.random() * 3);
  return {
    budget: people * 40,
    budgetMode: "total",
    food: ["鸡肉", "汉堡", "随便"][Math.floor(Math.random() * 3)],
    people,
    random: true
  };
}

const CN_NUM = { "一": 1, "两": 2, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10 };

function parsePreferenceParts(text) {
  const budgetKeyword = text.match(/(总预算|人均预算|人均|预算)\s*[：:]?\s*(?:[¥￥]\s*)?(\d+(?:\.\d+)?)/);
  const budgetLoose = /预算|以内|上下|左右/.test(text) ? text.match(/(\d+(?:\.\d+)?)\s*(?:元|块)/) : null;
  const budgetMatch = budgetKeyword || budgetLoose;
  const peopleMatch = text.match(/(\d+|[一两二三四五六七八九十])\s*(?:个人|人|位)/);
  const foodTags = ["早餐", "牛肉", "鸡肉", "鸡", "麦香鱼", "鱼", "薯条", "汉堡", "随便", "都行", "均可", "看着办", "辣"];
  const foundFood = foodTags.find((tag) => text.includes(tag));
  const people = peopleMatch ? (CN_NUM[peopleMatch[1]] || Number(peopleMatch[1])) : null;
  return {
    budget: budgetMatch ? Number(budgetMatch[2] || budgetMatch[1]) : null,
    budgetMode: budgetMatch ? ((budgetKeyword ? budgetKeyword[1] : "").includes("人均") ? "per-person" : "total") : null,
    food: foundFood ? (foundFood === "鸡" ? "鸡肉" : (["都行", "均可", "看着办"].includes(foundFood) ? "随便" : (foundFood === "辣" ? "鸡肉" : foundFood))) : null,
    people
  };
}

function budgetTotal() {
  const p = state.preferences;
  return p.budgetMode === "total" ? p.budget : p.budget * p.people;
}

function buildRoute() {
  const bonusRoom = Math.random() < 0.5 ? "secret" : "campaign";
  const rooms = ["coupon", "nutrition", "incident", "lottery", bonusRoom];
  if (Math.random() < 0.4) rooms.push(Math.random() < 0.5 ? "incident" : "secret");
  return shuffle(rooms);
}

function launchGame(preferences) {
  state.preferences = preferences;
  state.route = buildRoute();
  state.roomIndex = 0;
  state.steps = 0;
  state.hp = 15;
  state.points = DEMO.points;
  state.couponsClaimed = false;
  state.drinkVoucher = false;
  state.loot = [];
  state.order = null;
  state.boss = BOSSES[Math.floor(Math.random() * BOSSES.length)];
  state.bags = {};
  state.stage = "running";
  setSuggestions([]);
  const budgetLabel = preferences.budgetMode === "total" ? "总预算" : "人均预算";
  const randomNote = preferences.random ? "这次预算、口味和人数也由随机数生成：" : "本局参数载入：";
  const bubble = addAssistant("🧭 工位地图展开，午间副本载入中……\n" + randomNote + preferences.people + " 人，「" + budgetLabel + " ¥" + preferences.budget + "」，想吃「" + preferences.food + "」。\n🕒 时空判定：午间狂热战场（" + DEMO.time + "）\n💰 麦麦金库：" + DEMO.points + " 点，其中 " + DEMO.expiring + " 点将在 7 天内到期。❤️ 当前饱腹能量：" + state.hp + "%（低能量警报）\n" + state.route.length + " 个房间已经洗牌，暂时藏进迷雾。踩到补给格会自动领取免费券；抽奖会先亮明积分成本，最后的订单也由你决定。终局看门的是「" + state.boss.name + "」，祝你不被需求变更。", "start");
  addActions(bubble, [{ label: "🎲 投掷骰子", run: roll, kind: "primary" }]);
}

function roll() {
  if (state.stage !== "running") return;
  if (state.roomIndex >= state.route.length) return showForge();
  addUser("🎲 投掷骰子");
  const die = 1 + Math.floor(Math.random() * 6);
  state.steps += die;
  const room = state.route[state.roomIndex++];
  const diceLine = pickFrom("dice", DICE_LINES).replace("{die}", die);
  const bubble = addAssistant("🎲 " + diceLine + "向前推进 " + die + " 格，本局累计 " + state.steps + " 格。\n" + pickRoomLine(room) + "你踩中了「" + ROOM_NAMES[room] + "」！", room);
  if (room === "coupon") resolveCoupon(bubble);
  else if (room === "nutrition") resolveNutrition(bubble);
  else if (room === "incident") resolveIncident(bubble);
  else if (room === "lottery") resolveLottery(bubble);
  else if (room === "campaign") resolveCampaign(bubble);
  else resolveSecret(bubble);
}

function continueActions(bubble, label) {
  const routeDone = state.roomIndex >= state.route.length;
  addActions(bubble, [{
    label: label || (routeDone ? "⚔️ 进入终局锻造" : "🎲 继续探索"),
    run: () => (routeDone ? showForge() : roll())
  }]);
}

function resolveCoupon(bubble) {
  const bundle = pickFrom("coupon", COUPON_BUNDLES);
  if (bundle.coupons) {
    state.couponsClaimed = true;
    state.loot.push(bundle.loot);
    addText(bubble, bundle.text, "message-text");
  } else {
    state.hp = Math.min(100, state.hp + 5);
    state.loot.push(bundle.loot);
    addText(bubble, bundle.text + "\n当前 HP " + state.hp + "/100。", "message-text");
  }
  continueActions(bubble);
}

function selectedBurger() {
  const food = state.preferences.food || "随便";
  if (food.includes("早餐")) return DEMO.burgers.find((item) => item.key === "早餐");
  if (food.includes("牛")) return DEMO.burgers.find((item) => item.key === "牛");
  if (food.includes("鱼")) return DEMO.burgers.find((item) => item.key === "鱼");
  return DEMO.burgers[0];
}

function selectedSide() {
  if ((state.preferences.food || "").includes("薯条")) return DEMO.friesSide;
  return selectedBurger().key === "鸡" ? DEMO.chickenSide : DEMO.friesSide;
}

function resolveNutrition(bubble) {
  const main = selectedBurger();
  const side = selectedSide();
  const person = state.preferences.people;
  const gain = 12 + person * 5;
  state.hp = Math.min(100, state.hp + gain);
  state.loot.push(main.name + " ×" + person, side.name + " ×" + person);
  const nutrition = {
    kcal: main.kcal + side.kcal + DEMO.drink.kcal,
    protein: main.protein + side.protein + DEMO.drink.protein,
    fat: main.fat + side.fat + DEMO.drink.fat,
    carb: main.carb + side.carb + DEMO.drink.carb
  };
  const lines = [
    "🍔 食材密室的烤箱门自己开了：" + main.name + "、" + side.name + " 和一杯零度可乐组成每人一份的补给。",
    "🍔 掉落播报：「" + main.name + "」和「" + side.name + "」落入背包，附赠零度可乐一杯，正好" + person + " 人份。"
  ];
  addText(bubble, pickFrom("nutrition", lines) + "\nHP +" + gain + "，当前 " + state.hp + "/100；血条回血，营养面板也跟着刷新。\n每人约 " + nutrition.kcal + " kcal｜蛋白质 " + nutrition.protein + "g｜脂肪 " + nutrition.fat + "g｜碳水 " + nutrition.carb + "g\n" + person + " 人合计约 " + (nutrition.kcal * person) + " kcal。饥饿告警从红色降成橙色。", "message-text");
  continueActions(bubble);
}

function resolveIncident(bubble) {
  const event = pickFrom("incident", INCIDENTS);
  state.hp = Math.min(100, state.hp + event.hp);
  state.loot.push("程序员事件增益");
  addText(bubble, "🧑‍💻 " + event.title + "\n" + event.text + "\nHP +" + event.hp + "，现在 " + state.hp + "/100。这个增益只改本局状态，提交前无需 code review。", "message-text");
  continueActions(bubble);
}

function resolveCampaign(bubble) {
  const event = pickFrom("campaign", CAMPAIGN_EVENTS);
  state.hp = Math.min(100, state.hp + event.hp);
  state.loot.push(event.loot);
  addText(bubble, event.text + "\n当前 HP " + state.hp + "/100。", "message-text");
  continueActions(bubble);
}

function resolveSecret(bubble) {
  const event = pickFrom("secret", SECRET_EVENTS);
  state.hp = Math.min(100, state.hp + event.hp);
  state.loot.push(event.loot);
  addText(bubble, event.text + "\n当前 HP " + state.hp + "/100。", "message-text");
  continueActions(bubble);
}

function resolveLottery(bubble) {
  state.stage = "lottery";
  addText(bubble, "🎡 积分抽奖站亮起金色灯牌，本局展示奖品是「" + LOTTERY_PRIZE + "」（示例数据）。虚拟转盘不扣积分，按游戏内随机结果运行；想试积分抽奖的话，这次会花 50 点，余额将从 " + state.points + " 变成 " + Math.max(0, state.points - 50) + "。你也可以直接跳过，把积分带去终局。", "message-text");
  addActions(bubble, [
    { label: "玩虚拟转盘（不扣分）", run: playVirtualLottery },
    { label: "积分抽奖 · 扣50点", run: playPointLottery, kind: "primary" },
    { label: "跳过", run: skipLottery, kind: "quiet" }
  ]);
}

function finishLottery(text, kind) {
  state.stage = "running";
  const bubble = addAssistant(text, kind || "lottery");
  continueActions(bubble);
}

function playVirtualLottery() {
  if (state.stage !== "lottery") return;
  addUser("玩虚拟转盘");
  const wins = Math.random() < 0.3;
  const result = wins ? pickFrom("virtual-win", VIRTUAL_WINS) : pickFrom("virtual-lose", VIRTUAL_CONSOLATIONS);
  finishLottery("✨ 虚拟转盘咕噜咕噜转了三圈——" + result + " 这只是游戏里的随机结局，不套用官方中奖概率，也不消耗你的积分。", "lottery");
}

function playPointLottery() {
  if (state.stage !== "lottery") return;
  addUser("积分抽奖 · 扣50点");
  const cost = 50;
  state.points -= cost;
  const won = Math.random() < 0.55;
  state.drinkVoucher = won;
  if (won) state.loot.push(LOTTERY_PRIZE);
  const result = won
    ? "🎉 金光从转盘缝里喷出来！抽中「" + LOTTERY_PRIZE + " ×1」（示例数据），已放进本局背包，终局账单会用上它。"
    : "转盘停在空格，奖池给你留下一声很有礼貌的“下次一定”。";
  finishLottery(result + "\n本局积分：" + (state.points + cost) + " → " + state.points + "（-" + cost + "）。", "lottery");
}

function skipLottery() {
  if (state.stage !== "lottery") return;
  addUser("跳过抽奖");
  finishLottery("你把积分袋口扎紧，绕过转盘继续走。余额仍是 " + state.points + " 点；谨慎构筑也是一种稀有流派。", "lottery");
}

function buildPrice() {
  const people = state.preferences.people;
  const burger = selectedBurger();
  const side = selectedSide();
  const burgerSubtotal = burger.price * people;
  const sideSubtotal = side.price * people;
  const drinkSubtotal = DEMO.drink.price * people;
  const foodSubtotal = burgerSubtotal + sideSubtotal + drinkSubtotal;
  const delivery = 9;
  const burgerDiscount = state.couponsClaimed ? Math.min(5, burgerSubtotal) : 0;
  const sideDiscount = state.couponsClaimed && side === DEMO.chickenSide ? side.price / 2 : 0;
  const drinkDiscount = state.drinkVoucher ? DEMO.drink.price : 0;
  const deliveryDiscount = state.couponsClaimed && foodSubtotal >= 59 ? delivery : 0;
  const total = foodSubtotal + delivery - burgerDiscount - sideDiscount - drinkDiscount - deliveryDiscount;
  const nutrition = {
    kcal: burger.kcal + side.kcal + DEMO.drink.kcal,
    protein: burger.protein + side.protein + DEMO.drink.protein,
    fat: burger.fat + side.fat + DEMO.drink.fat,
    carb: burger.carb + side.carb + DEMO.drink.carb
  };
  return { people, burger, side, burgerSubtotal, sideSubtotal, drinkSubtotal, foodSubtotal, delivery, burgerDiscount, sideDiscount, drinkDiscount, deliveryDiscount, total, nutrition };
}

function money(value) {
  return "¥" + value.toFixed(2);
}

function showForge() {
  if (["forge", "order-confirm", "finished"].includes(state.stage)) return;
  state.stage = "forge";
  addUser("进入终局锻造");
  const bill = buildPrice();
  state.order = bill;
  const budget = budgetTotal();
  const overBudget = bill.total > budget;
  const room = overBudget ? "预算编译失败：超出 ¥" + (bill.total - budget).toFixed(2) : "预算编译通过";
  const burgerDiscount = bill.burgerDiscount ? "汉堡 -" + money(bill.burgerDiscount) : "汉堡无可用券";
  const sideDiscount = bill.sideDiscount ? "琵琶腿半价 -" + money(bill.sideDiscount) : "小食无可用券";
  const drinkDiscount = bill.drinkDiscount ? "抽奖券 -" + money(bill.drinkDiscount) : "饮料无兑换券";
  const deliveryDiscount = bill.deliveryDiscount ? "免配送费 -" + money(bill.deliveryDiscount) : "配送费照常计算";
  const perPerson = bill.total / bill.people;
  const composition = bill.burger.name + " ×" + bill.people + "、" + bill.side.name + " ×" + bill.people + "、" + DEMO.drink.name + " ×" + bill.people;
  const details = "商品（示例数据）：" + composition + "\n餐品小计 " + money(bill.foodSubtotal) + " + 配送 " + money(bill.delivery) + "\n优惠：" + [burgerDiscount, sideDiscount, drinkDiscount, deliveryDiscount].join("｜") + "\n应付 " + money(bill.total) + "（人均 " + money(perPerson) + "）｜" + room + "\n每人营养：" + bill.nutrition.kcal + " kcal · 蛋白质 " + bill.nutrition.protein + "g · 脂肪 " + bill.nutrition.fat + "g · 碳水 " + bill.nutrition.carb + "g\n配送示例：科技园 3 期 A 座 · 中关村南路店";
  const bubble = addAssistant("🔔 累计行进 " + state.steps + " 格，终局 Boss「" + state.boss.name + "」挡住出口！" + state.boss.intro + "\n战利品是「" + (state.loot.length ? state.loot.join("、") : "路线徽章 ×0") + "」，HP " + state.hp + "/100。终极锻造账单：\n" + details + "\n" + (overBudget ? "超出预算，Boss 还剩一格血；可以先带走方案，或重新开局换个构筑。" : "剩余预算 " + money(budget - bill.total) + "，Boss 已倒地。"), "forge");
  const actions = [
    { label: "确认生成订单回执", run: confirmOrder, kind: "primary" },
    { label: "只看方案", run: skipOrder, kind: "quiet" }
  ];
  if (overBudget) actions.push({ label: "🎲 重新开局", run: resetRun, kind: "quiet" });
  addActions(bubble, actions);
  state.stage = "order-confirm";
}

function confirmOrder() {
  if (state.stage !== "order-confirm") return;
  addUser("确认生成订单回执");
  const orderId = "#MCD-" + new Date().toISOString().slice(0, 10).replaceAll("-", "") + "-" + String(Math.floor(1000 + Math.random() * 9000));
  state.stage = "finished";
  const bubble = addAssistant("🎉 通关成功！订单回执已生成。\n订单号 " + orderId + " · 待支付\n应付 " + money(state.order.total) + " · 配送至科技园 3 期 A 座（示例地址）\n冒险者带着 HP " + state.hp + "/100 和 " + state.loot.length + " 件战利品通关。这只是模拟回执：真实 Skill 会展示 MCP 返回的订单与支付链接，支付由你在官方页面完成，本页不会真的扣款。", "order");
  addActions(bubble, [{ label: "再开一局", run: resetRun, kind: "primary" }]);
}

function skipOrder() {
  if (state.stage !== "order-confirm") return;
  addUser("只看方案");
  state.stage = "finished";
  const bubble = addAssistant("🏁 你把套餐方案收入背包，暂时不下单。" + state.boss.name + "退回地牢，等下一局再来挑战。", "finish");
  addActions(bubble, [{ label: "再开一局", run: resetRun, kind: "primary" }]);
}

function resetRun() {
  conversation.replaceChildren();
  state.stage = "setup";
  state.preferences = { budget: null, budgetMode: null, food: null, people: null };
  state.route = [];
  state.roomIndex = 0;
  state.steps = 0;
  state.hp = 15;
  state.points = DEMO.points;
  state.couponsClaimed = false;
  state.drinkVoucher = false;
  state.loot = [];
  state.order = null;
  state.bags = {};
  setSuggestions([]);
  greet();
}

function replyFallback() {
  const pool = FALLBACKS[state.stage] || FALLBACKS.running;
  addAssistant(pickFrom("fallback-" + state.stage, pool), "help");
}

function handleMessage(raw) {
  const text = raw.trim();
  if (!text) return;
  if (/重新开局|再玩一局|再开一局|再来一局/.test(text) && !["setup", "finished"].includes(state.stage)) return resetRun();
  if (state.stage === "setup") {
    addUser(text);
    if (/全随机|随机开局|随便开/.test(text)) return launchGame(makeRandomPreferences());
    const parts = parsePreferenceParts(text);
    state.preferences = {
      budget: parts.budget ?? state.preferences.budget,
      budgetMode: parts.budgetMode ?? state.preferences.budgetMode,
      food: parts.food ?? state.preferences.food,
      people: parts.people ?? state.preferences.people
    };
    const p = state.preferences;
    if (!p.budget || !p.people || !p.food) {
      const missing = [];
      if (!p.budget) missing.push("总预算或人均预算");
      if (!p.food) missing.push("想吃什么（或说随便）");
      if (!p.people) missing.push("几个人");
      const bubble = addAssistant("收到。还差「" + missing.join("、") + "」；补上这些参数，地图就能生成。比如：总预算 80 元，鸡肉，2 个人。", "help");
      return;
    }
    if (p.people < 1 || p.people > 20 || p.budget <= 0) {
      state.preferences = { budget: null, budgetMode: null, food: null, people: null };
      return addAssistant("人数要在 1 到 20 人之间，预算也得大于 0。把这两个数改好再丢给我，路线生成器马上重跑。", "help");
    }
    return launchGame(p);
  }
  if (state.stage === "running" && /掷骰子|投掷|继续/.test(text)) return roll();
  if (state.stage === "lottery" && /跳过|不用|算了/.test(text)) return skipLottery();
  if (state.stage === "lottery" && /虚拟|游戏|试试手气/.test(text)) return playVirtualLottery();
  if (state.stage === "lottery" && /积分|真实/.test(text)) return playPointLottery();
  if (state.stage === "order-confirm" && /不下单|只看|跳过|再想想|考虑/.test(text)) return skipOrder();
  if (state.stage === "order-confirm" && /确认|下单|出单/.test(text)) return confirmOrder();
  if (state.stage === "finished" && /再开|再来|重新|下一局/.test(text)) return resetRun();
  addUser(text);
  replyFallback();
}

composer.addEventListener("submit", (event) => {
  event.preventDefault();
  const value = input.value;
  input.value = "";
  input.style.height = "auto";
  handleMessage(value);
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    composer.requestSubmit();
  }
});

document.getElementById("new-chat-button").addEventListener("click", resetRun);
document.getElementById("sidebar-toggle").addEventListener("click", () => {
  if (window.matchMedia("(max-width: 760px)").matches) workspace.classList.toggle("sidebar-open");
  else workspace.classList.toggle("sidebar-collapsed");
});
document.getElementById("sidebar-backdrop").addEventListener("click", () => workspace.classList.remove("sidebar-open"));
document.querySelector(".banner-dismiss").addEventListener("click", (event) => {
  event.currentTarget.closest(".simulation-banner").hidden = true;
});
document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    if (window.matchMedia("(max-width: 760px)").matches) workspace.classList.add("sidebar-open");
    else resetRun();
  }
  if (event.key === "Escape") workspace.classList.remove("sidebar-open");
});

greet();

</script>
